name: Feature request
description: Propose a capability and its human-permission boundary
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Permission, backup, verification and rollback requirements
      description: Explain what remains read-only, what needs approval, and how failure is reported.
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: New or ongoing cost
      description: State £0 or identify the exact potential cost; paid services require explicit approval.
