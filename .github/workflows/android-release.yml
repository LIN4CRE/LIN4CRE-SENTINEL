name: Publish Android Companion Preview

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'New preview release tag (for example android-v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "Tag must look like android-v0.1.0 or android-v0.1.0-preview.1" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "A release with this tag already exists: $TAG_NAME" >&2
            exit 1
          fi
      - name: Build preview APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Prepare checksum
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/SENTINEL-Android-Companion-preview.apk
          cd release-assets
          sha256sum SENTINEL-Android-Companion-preview.apk > SENTINEL-Android-Companion-preview.apk.sha256
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            release-assets/SENTINEL-Android-Companion-preview.apk \
            release-assets/SENTINEL-Android-Companion-preview.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "SENTINEL Android Companion ${TAG_NAME} (preview)" \
            --prerelease \
            --notes-file android/RELEASE-NOTES.md
