name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compilation
        run: python -m compileall -q backend host_companion windows
      - name: Isolated acceptance tests
        run: python -m unittest discover -s tests -v
        env:
          SENTINEL_DISABLE_MONITOR: '1'
      - name: Install frontend dependencies
        run: npm ci
      - name: Production build and Windows setup package
        run: npm run build
      - name: Validate generated Windows setup package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path('dist/downloads/LIN4CRE-SENTINEL-Windows-Setup.zip')
          assert archive_path.is_file(), f'missing packaged download: {archive_path}'
          with ZipFile(archive_path) as archive:
              names = set(archive.namelist())
          assert 'LIN4CRE-SENTINEL/dist/index.html' in names, 'built frontend missing from setup archive'
          assert 'LIN4CRE-SENTINEL/windows/SentinelSetup.cmd' in names, 'Windows setup entry point missing'
          assert not any(name.endswith(('.db', '.db-wal', '.db-shm')) for name in names), 'runtime database leaked into archive'
          print(f'Validated {archive_path}: {len(names)} entries')
          PY
      - name: Check for accidentally tracked runtime secrets/data
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|host-data|host_data|sentinel\.db|host-token)$'
          ! git ls-files data host_data runtime | grep -v -E '\.gitkeep$' || test -z "$(git ls-files data host_data runtime)"
