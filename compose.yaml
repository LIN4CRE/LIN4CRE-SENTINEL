services:
  sentinel:
    build: .
    ports:
      - "127.0.0.1:8787:8000"
    environment:
      SENTINEL_DATA_DIR: /data
    volumes:
      - sentinel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Deliberately no Docker socket, host network, privileged mode or host filesystem mounts.

volumes:
  sentinel-data:
